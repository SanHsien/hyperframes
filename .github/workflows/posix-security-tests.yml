name: POSIX security tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posix-security-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The POSIX-only permission tests in these four files are `it.skipIf(process.platform === "win32")`,
  # and windows-render.yml is Windows-only, so no job ever executed them until this one. The guard
  # step reads vitest's JSON report and fails if any of them is skipped or missing rather than passed
  # (a green run with a skipped test proves nothing). Kept out of ci.yml, which
  # tools/tests/test_fork_docs.py pins to Windows-only.
  test-posix-security:
    name: test (linux / posix security tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      REPORT_DIR: ${{ github.workspace }}/.vitest-reports
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two of the videoFrameExtractor cases synthesize a clip with `ffmpeg` on PATH and sit inside
      # describe.skipIf(!HAS_FFMPEG), so without it they are silently skipped.
      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-linux

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # --ignore-scripts: the repo's own only lifecycle script is the root `prepare` (lefthook
      # hooks, useless in CI). A dependency's postinstall, ffmpeg-static's binary download, is
      # unneeded: these tests spawn the ffmpeg installed above, and only aws-lambda uses that package.
      - name: Install dependencies
        run: bash scripts/ci/install-workspace-dependencies.sh --ignore-scripts

      - name: Require a non-root runner user
        run: |
          echo "uid=$(id -u) user=$(id -un)"
          test "$(id -u)" -ne 0

      # Vitest loads these workspace packages through their Node dist exports.
      - name: Build test prerequisites
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build

      - name: Run engine POSIX tests
        run: >-
          bun run --cwd packages/engine test
          --reporter=verbose --reporter=json --outputFile.json="$REPORT_DIR/engine.json"
          src/services/extractionCache.test.ts src/services/videoFrameExtractor.test.ts

      - name: Run cli POSIX tests
        if: ${{ !cancelled() }}
        run: >-
          bun run --cwd packages/cli test
          --reporter=verbose --reporter=json --outputFile.json="$REPORT_DIR/cli.json"
          src/commands/clean.test.ts

      - name: Run producer POSIX tests
        if: ${{ !cancelled() }}
        working-directory: packages/producer
        run: >-
          bun x vitest run
          --reporter=verbose --reporter=json --outputFile.json="$REPORT_DIR/producer.json"
          src/services/render/stages/compileStage.gifCache.test.ts

      - name: Assert the POSIX tests passed, not skipped
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const dir = process.env.REPORT_DIR;
          const expected = {
            "engine.json": {
              "extractionCache.test.ts": [
                "rejects a root that is a symlink",
                "rejects a root other users can access",
                "tightens an own, non-writable-by-others root",
                "still refuses a group-writable root",
                "replaces a symlinked marker instead of writing through it",
              ],
              "videoFrameExtractor.test.ts": [
                "disables caching and writes no sweep marker when the cache root is group/world accessible",
                "disables caching when the cache root is a symlink",
              ],
            },
            "cli.json": {
              "clean.test.ts": [
                "skips an extraction cache other users can write to and does not stamp it",
                "skips a symlinked extraction cache and does not write through it",
                "reports a leftover it cannot remove and still removes the rest",
                "still cleans when the history folder cannot be read",
              ],
            },
            "producer.json": {
              "compileStage.gifCache.test.ts": [
                "disables the GIF cache for a world-writable root",
                "disables the GIF cache for a symlinked root",
              ],
            },
          };
          let missing = 0;
          for (const [report, files] of Object.entries(expected)) {
            const results = JSON.parse(readFileSync(`${dir}/${report}`, "utf8")).testResults;
            for (const [file, titles] of Object.entries(files)) {
              const suite = results.find((r) => r.name.endsWith(`/${file}`));
              for (const title of titles) {
                const hit = suite?.assertionResults.find((a) => a.title.includes(title));
                const status = hit ? hit.status : "not found";
                console.log(`${status === "passed" ? "ok  " : "FAIL"} ${file}: ${title} -> ${status}`);
                if (status !== "passed") missing += 1;
              }
            }
          }
          if (missing > 0) {
            console.log(`::error::${missing} POSIX security test(s) did not pass; a skipped test is not a pass.`);
            process.exit(1);
          }
          NODE
